name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build
        run: ./gradlew jar --no-daemon --stacktrace

      # Guard against the "build succeeds but the jar is empty" failure mode:
      # plugin.yml and the compiled classes must actually be inside the jar.
      - name: Verify jar contents
        run: |
          JAR=$(ls build/libs/*.jar | head -n 1)
          echo "Checking $JAR"
          unzip -l "$JAR" | grep -q 'plugin.yml' \
            || { echo '::error::plugin.yml missing from jar'; exit 1; }
          unzip -l "$JAR" | grep -q 'dev/keepclaims/KeepClaims.class' \
            || { echo '::error::compiled classes missing from jar'; exit 1; }
          if unzip -p "$JAR" plugin.yml | grep -q '\${version}'; then
            echo '::error::version placeholder in plugin.yml was not expanded'; exit 1
          fi
          echo "Jar contents OK"

      - uses: actions/upload-artifact@v6
        with:
          name: MaterialClaim
          path: build/libs/*.jar
          if-no-files-found: error

      # On a v* tag, publish the jar as a GitHub Release. Running this inside the
      # build job means the release always uses the jar that just passed the
      # verification step above.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | head -n 1)
          gh release create "$GITHUB_REF_NAME" "$JAR" \
            --title "MaterialClaim $GITHUB_REF_NAME" \
            --generate-notes
