# How often to check for expired claims (minutes)
check-interval-minutes: 5

# Hours of upkeep the initial claim payment must cover
initial-hours: 168

# Nobody can bank more than this many days per claim
max-prepaid-days: 30

# After upkeep runs out, how many days before the claim is deleted
grace-days: 7

# Warn the player on join if any claim has less than this many days left
warn-days: 3

# Leave empty to allow all worlds
enabled-worlds: []

# Default maximum claims per player (can be raised with keepclaims.limit.<n>)
max-claims-default: 25

# Blocks that anyone can interact with inside a claim (e.g. signs, buttons you want public)
public-blocks: []

# Item values: how many hours of upkeep for one chunk at multiplier 1.0
materials:
  COPPER_INGOT: 4
  IRON_INGOT: 6
  GOLD_INGOT: 8
  DIAMOND: 72
  NETHERITE_INGOT: 240
  COPPER_BLOCK: 36
  IRON_BLOCK: 54
  GOLD_BLOCK: 72
  DIAMOND_BLOCK: 648
  NETHERITE_BLOCK: 2160

# Cost tiers based on how many claims the player already has
cost-tiers:
  - up-to: 3
    multiplier: 0.5
  - up-to: 10
    multiplier: 1.0
  - up-to: 999
    multiplier: 1.5

messages:
  prefix: "<dark_green>[KC]</dark_green> "
  no-permission: "<red>You do not have permission."
  world-disabled: "<red>Claims are disabled in this world."
  already-yours: "<yellow>You already own this chunk."
  already-claimed: "<red>This chunk is claimed by {owner}."
  limit-reached: "<red>You have reached your claim limit ({limit})."
  claim-success: "<green>Chunk claimed! Upkeep paid for {time}."
  unclaim-success: "<yellow>Claim removed."
  not-your-claim: "<red>This is not your claim."
  no-claim-here: "<gray>This chunk is not claimed."
  pay-success: "<green>Paid! Upkeep now lasts {time} from now."
  max-prepaid: "<yellow>This claim is already paid to the maximum."
  capped: "<yellow>Payment capped at the maximum prepaid time."
  trust-added: "<green>{name} can now build in this claim."
  trust-removed: "<yellow>{name} removed from this claim."
  already-trusted: "<yellow>{name} is already trusted."
  trust-self: "<red>You cannot trust yourself."
  unknown-player: "<red>Player not found."
  reloaded: "<green>KeepClaims reloaded."
  bypass-on: "<yellow>Bypass on. You can build anywhere."
  bypass-off: "<green>Bypass off."
  server-claimed: "<green>{count} chunk(s) marked as server claims."
  admin-unclaimed: "<yellow>Claim removed by admin."
  claim-expired: "<red>Your claim at {x},{z} has expired and been removed."
  expiring-warning: "<yellow>{count} of your claims are running low on upkeep."
  protected: "<red>This chunk is protected by {owner}."
