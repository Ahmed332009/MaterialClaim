# MaterialClaim configuration
# Item values below are hours of upkeep for ONE chunk. A diamond is worth 12 hours.

# Worlds where claiming is allowed. Empty list = every world.
enabled-worlds: []

# Default maximum chunks per player (all territories together). Give more with the permission materialclaim.limit.<number>
max-claims-default: 25

# ---------------------------------------------------------------------------
# CLAIM PRICING
# Land is claimed in BLOCKS with a golden shovel. One old chunk (16x16) is 256 blocks,
# and the default price below keeps the old economy exactly: a 256 block claim costs 96
# hours of upkeep (8 diamonds at 12h), just like one chunk used to.
#
# Two modes, chosen by 'mode':
#   flat   - price is strictly proportional to area: blocks * per-block price.
#   tiered - the per-block price is multiplied by a factor from 'tiers', chosen by the
#            number of blocks being claimed. Big claims can be cheaper (or dearer) per
#            block. Edit the tier table and change mode to 'tiered' to use it.
# ---------------------------------------------------------------------------
claim-price:
  mode: flat
  # Price of one 16x16 chunk (= 256 blocks). Change this to change the whole economy.
  per-chunk-hours: 96
  # Never charge less than this for a brand new claim, whatever the area.
  minimum-hours: 0
  # Smallest and largest area a player may claim, in blocks. 0 = no limit.
  minimum-blocks: 100
  maximum-blocks: 0
  # Only used when mode is 'tiered'. Sorted by up-to-blocks; the first row that fits wins.
  # A multiplier of 1.0 means full price, 0.7 means 30% off, etc.
  tiers:
    - up-to-blocks: 1024
      multiplier: 1.0
    - up-to-blocks: 4096
      multiplier: 0.85
    - up-to-blocks: 16384
      multiplier: 0.7
    - up-to-blocks: 1000000
      multiplier: 0.6

# How the ongoing upkeep drain scales with territory size, in BLOCKS.
# A territory of n blocks drains (n / 256) x multiplier hours per hour before paid
# protections. 1.0 means every block costs the same, exactly as chunks used to.
# The first row whose up-to-blocks is at least the territory size wins.
upkeep-tiers:
  - up-to-blocks: 1000000
    multiplier: 1.0

# Greet a player who has never played on this server before and explain the claim plugin.
# The wording lives in messages.welcome* below, so it can be edited freely.
welcome-first-join: true

# Border and selection particles.
borders:
  # How long Show borders stays visible, in seconds.
  show-seconds: 30
  # Particle used for borders. END_ROD is bright white and visible from far away.
  # Other good choices: FLAME, SOUL_FIRE_FLAME, ELECTRIC_SPARK, ENCHANTED_HIT.
  particle: END_ROD
  # Particles per block along a border edge. 1 = one per block, 2 = denser.
  density: 2

# Tool items. Left click sets the first corner, right click sets the second and opens the
# price menu. The stick inspects land.
tools:
  claim-tool: GOLDEN_SHOVEL
  inspect-tool: STICK
  # Require the tool to be in the main hand (recommended: stops accidental claims).
  require-item: true

# Nobody may own more than this many blocks in total, across all territories.
# 0 = use max-claims-default (in chunks) instead.
max-claim-blocks: 0

# Accepted items and the hours of upkeep each is worth for ONE chunk.
# Only plain items count (renamed or enchanted items are ignored).
# The claim price is claim-price.per-chunk-hours (96 per 256 blocks), so one chunk
# of land costs 64 copper, 32 iron,
# 16 gold, 8 diamonds or 1 netherite ingot. A diamond is worth 12 hours.
# Blocks are worth 9x the matching ingot.
materials:
  COPPER_INGOT: 1.5
  COPPER_BLOCK: 13.5
  IRON_INGOT: 3
  IRON_BLOCK: 27
  GOLD_INGOT: 6
  GOLD_BLOCK: 54
  DIAMOND: 12
  DIAMOND_BLOCK: 108
  NETHERITE_INGOT: 96
  NETHERITE_BLOCK: 864

# Blocks anyone may still use inside other players' claims.
public-blocks:
  - CRAFTING_TABLE
  - ENDER_CHEST
  - ENCHANTING_TABLE
  - ANVIL
  - CHIPPED_ANVIL
  - DAMAGED_ANVIL
  - GRINDSTONE
  - LOOM
  - CARTOGRAPHY_TABLE
  - STONECUTTER
  - SMITHING_TABLE

# Per-territory settings.
#
# Each paid protection is bought ONCE for exactly 24 hours taken off the territory's own
# upkeep clock (a territory needs at least 24 hours left to buy one). After that it is free
# to switch on and off forever, with no refunds at any point, including when you unclaim.
#
# Every purchase also raises that territory's upkeep cost permanently, by
# paid-protection-upkeep-multiplier each time. The rise is locked in even while the
# protection is switched OFF, so owning all four makes upkeep cost 2x: a diamond that is
# worth 12h becomes worth 9.6h, 8h, 6.9h and finally 6h as protections are bought.
# Switching a bought protection off never lowers the cost and never gives hours back.
#
# In the defaults below, true still means vanilla behaviour (the protection is off), so the
# shipped defaults start every territory with no paid protection. A brand new territory is
# created from these defaults with nothing purchased.
#
# Free toggles never cost anything. true = visitors are allowed to do that thing.
territory-settings:
  # Each bought protection (owned, even if switched off) raises upkeep cost by this
  # fraction, permanently. 0.25 means all four bought = 2x upkeep cost.
  paid-protection-upkeep-multiplier: 0.25
  # The purchase price is not configured here: it is always 24 hours of the territory's
  # remaining upkeep, because it is paid from the territory clock, not from items.
  defaults:
    explosion-damage: true      # true = vanilla (not protected)
    pvp: true
    mob-spawning: true
    fire-spread: true
    visitor-doors: false
    visitor-containers: false
    visitor-animals: false
    mob-griefing: false         # false = blocked (safe by default)
    fluid-flow: false
    crop-trample: false
  # Admin can lock flags so players cannot change them. Set true to lock server-wide.
  locked:
    fire-spread: false

# Messages use MiniMessage formatting.
messages:
  prefix: "<dark_green>[Claims]</dark_green> "
  no-permission: "<red>You do not have permission."
  world-disabled: "<red>Claiming is not allowed in this world."
  already-yours: "<yellow>You already own this chunk."
  already-claimed: "<red>This chunk already belongs to {owner}."
  limit-reached: "<red>You reached your claim limit of {limit}."
  selection-first: "<gray>First corner set at <white>{x}, {z}</white>. <gray>Right click the opposite corner."
  shovel-hint-own: "<gray>Right click the air with the shovel to show this claim's border. <gray>Left click a block to claim more land."
  shovel-hint-wild: "<gray>Left click a block with the shovel for the first corner, then right click the opposite corner. <gray>Right click the air to cancel."
  border-shown: "<green>Showing the border of <white>{name}<green> for <white>{seconds}</white> seconds."
  border-none: "<gray>You are standing on <white>unclaimed land<gray>. Left click a block with the shovel to claim it."
  welcome: "<gold><bold>Welcome to the server!</bold></gold>"
  welcome-claim: "<gray>This server has a <white>land claim<gray> plugin. Claim land with a <white>golden shovel<gray>:"
  welcome-claim-line: "<dark_gray> > <gray>Left click a block for the first corner, right click the opposite corner."
  welcome-claim-line2: "<dark_gray> > <gray>The price menu opens automatically when you pick the second corner."
  welcome-command: "<dark_gray> > <gray>Or use <white>/claim<gray> to open the menu, and right click the air with the shovel to see your border."
  selection-cancelled: "<gray>Selection cancelled."
  selection-other-world: "<red>Both corners must be in the same world."
  selection-too-small: "<red>That selection is too small. The minimum is <white>{min}</white> blocks <gray>(about {side}x{side}). <gray>Make the box bigger, or lower <white>claim-price.minimum-blocks</white> in config.yml."
  selection-too-big: "<red>That selection is too big. The maximum is <white>{max}</white> blocks."
  overlaps-other: "<red>That land is already claimed by {owner}."
  selection-first-remove: "<gray>First corner set at <white>{x}, {z}</white>. <gray>Right click the opposite corner to remove that land."
  shovel-remove-not-yours: "<red>You can only remove your own land."
  shovel-unclaim-hint: "<gray>Sneak and right click a corner of your own land to remove it."
  stick-info: "<gray>Owner: <white>{owner} <gray>| <white>{dims} <gray>| <white>{status}"
  stick-unclaimed: "<gray>This land is <white>unclaimed<gray>."
  stick-server: "<gray>This land is protected by the <aqua>server<gray>."
  tools-given: "<green>Gave you a {tool}."
  claim-success: "<green>Chunk claimed. Your territory is now <white>{size}</white> chunk(s) with <white>{time}</white> of upkeep."
  unclaim-success: "<yellow>Chunk unclaimed. Upkeep is not refunded."
  no-claim-here: "<red>There is no claim here."
  not-your-claim: "<red>That is not your claim."
  pay-success: "<green>Upkeep paid. This claim now has <white>{time}</white> left."
  max-prepaid: "<yellow>This claim is already at the maximum prepaid time."
  # Shown when a territory has room for less than a single item. Nothing is taken.
  over-cap: "<red>This territory can only hold {room} more upkeep, which is not enough for even one of those items. Pick a cheaper item, or use automatic."
  # Shown when a payment works out to zero or less (should not normally happen).
  nothing-paid: "<red>There is nothing to pay here."
  protected: "<red>This land is claimed by {owner}."
  trust-added: "<green>{name} can now build in this claim."
  trust-removed: "<yellow>{name} was removed from this claim."
  trust-self: "<red>You cannot trust yourself."
  already-trusted: "<yellow>{name} is already trusted here."
  unknown-player: "<red>Player not found."
  claim-expired: "<red>Your territory of {size} chunk(s) near chunk {x}, {z} ran out of upkeep and was removed."
  unclaim-split: "<red>Unclaiming this chunk would split your territory in two. Unclaim from the edges instead."
  expiring-warning: "<yellow>{count} of your territories are running low on upkeep. Open /claims to pay."
  reloaded: "<green>MaterialClaim reloaded."
  bypass-on: "<yellow>Claim bypass enabled."
  bypass-off: "<yellow>Claim bypass disabled."
  server-claimed: "<green>Claimed {count} chunk(s) for the server."
  admin-unclaimed: "<yellow>The whole connected territory was removed."
  flag-changed: "<green>{flag} is now {value}."
  flag-purchased: "<green>Bought {flag} for {hours} hours of upkeep. It is yours to toggle for free from now on, and nothing is refunded."
  flag-unchanged: "<yellow>{flag} is already {value}."
